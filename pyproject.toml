[project]
name = "pcm-django"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.0,<7.0",
    "gunicorn>=27.0.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.8",
    "whitenoise>=6.12.0",
]

[project.scripts]
pcm-django = "pcm_django:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
