
name: tes123

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: pcm_db
      POSTGRES_USER: pcm_user
      POSTGRES_PASSWORD: local_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql://pcm_user:local_dev_password@db:5432/pcm_db
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      USE_SUPABASE_STORAGE: "False"
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
