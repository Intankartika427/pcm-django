
{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}PCM Solo Utara{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'website/css/style.css' %}">
</head>
<body>

    <header class="site-header">
        <div class="container header-content">
            <a href="{% url 'website:home' %}" class="site-brand">
                PCM Solo Utara
            </a>

            <nav class="main-nav">
                <a href="{% url 'website:home' %}">Beranda</a>
                <a href="{% url 'website:home' %}#profil">Profil</a>
                <a href="{% url 'website:home' %}#informasi">Informasi</a>
                <a href="{% url 'website:home' %}#kontak">Kontak</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>
                &copy; 2026 PCM Solo Utara.
                Bergerak Mencerahkan, Berkhidmat Untuk Umat.
            </p>
        </div>
    </footer>

</body>
</html>
